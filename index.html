  <style>
    :root{
      --navy:#0f2747;
      --gold:#c7a447;
      --white:#ffffff;
      --ink:#18202a;
      --muted:#6b7280;
      --bg:#f4f6f8;
      --card:#ffffff;
      --radius:22px;
      --shadow:0 10px 28px rgba(15,39,71,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Tahoma, Arial, sans-serif;
      background:linear-gradient(180deg,#eef2f6 0%,#f8f9fb 45%,#ffffff 100%);
      color:var(--ink);
    }
    .app{
      width:min(100%,720px);
      margin:0 auto;
      min-height:100vh;
      padding:20px 16px 40px;
    }
    .hero{
      background:var(--card);
      border:1px solid rgba(15,39,71,.08);
      border-radius:28px;
      padding:24px 18px 20px;
      text-align:center;
      box-shadow:var(--shadow);
    }
    .logo{
      width:112px;
      height:112px;
      object-fit:contain;
      border-radius:24px;
      background:#fff;
      padding:5px;
      border:1px solid #e5e7eb;
    }
    h1{
      font-size:28px;
      color:var(--navy);
      margin:14px 0 5px;
      line-height:1.35;
    }
    .church{
      margin:0;
      color:var(--gold);
      font-weight:700;
      font-size:17px;
    }
    .now{
      margin-top:20px;
      background:var(--navy);
      color:#fff;
      border-radius:20px;
      padding:15px;
    }
    .date{font-size:17px;font-weight:700}
    .time{font-size:30px;font-weight:800;margin-top:5px;letter-spacing:.5px}
    .meeting{
      margin-top:16px;
      border:2px solid rgba(199,164,71,.6);
      border-radius:20px;
      padding:16px;
      background:#fffdf7;
    }
    .meeting-title{
      font-weight:800;
      color:var(--navy);
      font-size:19px;
    }
    .meeting-date{font-size:21px;font-weight:800;margin-top:8px}
    .meeting-time{color:var(--muted);margin-top:4px;font-weight:700}
    .countdown{
      margin-top:10px;
      color:#7a5d13;
      font-weight:800;
      font-size:18px;
    }
    .section-title{
      margin:24px 4px 12px;
      color:var(--navy);
      font-size:18px;
      font-weight:800;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .tile{
      appearance:none;
      border:0;
      text-decoration:none;
      background:#fff;
      color:var(--navy);
      min-height:104px;
      border-radius:20px;
      box-shadow:0 7px 20px rgba(15,39,71,.08);
      padding:14px 10px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:8px;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
    }
    .tile:active{transform:scale(.985)}
    .icon{
      width:40px;height:40px;border-radius:13px;
      display:grid;place-items:center;
      background:#f5edd6;color:#7a5d13;
      font-size:22px;
    }
    .tile.full{grid-column:1/-1}
    .note{
      margin-top:20px;
      font-size:13px;
      text-align:center;
      color:var(--muted);
      line-height:1.7;
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:26px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      padding:12px 16px;
      border-radius:14px;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      font-size:14px;
      z-index:10;
      width:max-content;
      max-width:85vw;
      text-align:center;
    }
    .toast.show{opacity:1}

    .subpage{
      margin-top:18px;
      background:#fff;
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:18px;
      border:1px solid rgba(15,39,71,.08);
    }
    .subpage-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:16px;
    }
    .subpage h2{
      margin:0;
      color:var(--navy);
      font-size:24px;
    }
    .subpage-head p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:14px;
    }
    .back-btn{
      border:0;
      background:var(--navy);
      color:#fff;
      border-radius:14px;
      padding:10px 14px;
      font-weight:800;
      cursor:pointer;
      min-height:44px;
    }
    .announcements-list{
      display:grid;
      gap:12px;
    }
    .announcement-card{
      border:1px solid #e5e7eb;
      border-right:5px solid var(--gold);
      border-radius:18px;
      padding:14px;
      background:#fff;
    }
    .announcement-card h3{
      margin:0 0 6px;
      color:var(--navy);
      font-size:18px;
    }
    .announcement-card .ann-date{
      color:#8a6c1c;
      font-weight:800;
      font-size:13px;
      margin-bottom:8px;
    }
    .announcement-card p{
      margin:0;
      line-height:1.8;
      color:#374151;
      font-size:15px;
    }
    .empty-state{
      text-align:center;
      color:var(--muted);
      padding:24px 10px;
      border:1px dashed #d1d5db;
      border-radius:16px;
      background:#fafafa;
    }

    @media (max-width:390px){
      h1{font-size:24px}
      .grid{gap:10px}
      .tile{font-size:15px;min-height:96px}
    }
  
    .page-view{
      background:#fff;
      border:1px solid rgba(15,39,71,.08);
      border-radius:26px;
      padding:18px;
      box-shadow:var(--shadow);
    }
    .page-top{display:flex;flex-direction:column;gap:18px}
    .page-heading{display:flex;align-items:center;gap:12px}
    .page-icon{
      width:52px;height:52px;border-radius:16px;background:#f5edd6;
      display:grid;place-items:center;font-size:27px;flex:0 0 auto;
    }
    .page-heading h2{margin:0;color:var(--navy);font-size:25px}
    .page-heading p{margin:4px 0 0;color:var(--muted);font-size:14px}
    .back-btn{
      align-self:flex-start;border:0;background:var(--navy);color:#fff;
      border-radius:14px;padding:11px 15px;font-weight:800;font-size:15px;
      min-height:44px;cursor:pointer;
    }
    #pageContent{margin-top:20px}
    .info-card,.empty-card{
      border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:13px;
      background:#fff;line-height:1.8;
    }
    .featured{background:#fffdf7;border-color:rgba(199,164,71,.65);text-align:center}
    .big-label{font-weight:800;color:var(--navy);font-size:18px}
    .big-value{font-weight:900;color:var(--navy);font-size:24px;margin:7px 0}
    .line{color:var(--muted);font-weight:700}
    .gold-text{color:#7a5d13;font-weight:900}
    .empty-card{text-align:center;padding:30px 18px}
    .empty-card h3{color:var(--navy);margin:8px 0}
    .empty-card p{color:var(--muted);margin:0}
    .empty-icon{font-size:38px}
    .timeline{display:grid;gap:12px}
    .timeline-item{
      display:flex;justify-content:space-between;gap:14px;align-items:center;
      padding:16px;border-radius:18px;background:#f8fafc;border:1px solid #e5e7eb;
    }
    .timeline-item b{color:#7a5d13}
    .timeline-item span{color:var(--navy);font-weight:700}
    .small-note{
      margin-top:14px;padding:13px;border-radius:14px;background:#f8fafc;
      color:var(--muted);font-size:13px;line-height:1.7;text-align:center;
    }
    .conference-poster{width:100%;display:block;border-radius:18px;border:1px solid #e5e7eb;margin-bottom:14px;cursor:zoom-in}
    .conference-card{text-align:right}
    .conference-card h3{margin:0 0 6px;color:var(--navy);font-size:23px}
    .conference-card .tagline{color:#7a5d13;font-weight:800;margin-bottom:14px}
    .conference-row{padding:10px 0;border-bottom:1px solid #eef0f3}
    .conference-row:last-of-type{border-bottom:0}
    .conference-row b{display:block;color:var(--navy);margin-bottom:2px}
    .register-btn{display:block;text-align:center;text-decoration:none;background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;font-weight:900;margin-top:16px}
    .poster-note{text-align:center;color:var(--muted);font-size:12px;margin:-5px 0 14px}
    .media-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .media-placeholder{
      min-height:130px;border-radius:20px;background:#f8fafc;border:1px solid #e5e7eb;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:8px;font-size:34px;color:var(--navy);
    }
    .media-placeholder span{font-size:15px;font-weight:800}

}

.daily-card:first-child{
  animation:dailyFade .8s ease;
}

@keyframes dailyFade{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

<script>
  const arDate = new Intl.DateTimeFormat('ar-EG', {
    weekday:'long', year:'numeric', month:'long', day:'numeric'
  });
  const arMeetingDate = new Intl.DateTimeFormat('ar-EG', {
    weekday:'long', year:'numeric', month:'long', day:'numeric'
  });
  const timeFmt = new Intl.DateTimeFormat('ar-EG', {
    hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true
  });

  function firstSunday(year, month){
    const d = new Date(year, month, 1, 18, 0, 0, 0);
    const add = (7 - d.getDay()) % 7;
    d.setDate(1 + add);
    return d;
  }

  function nextMeeting(now){
    const current = firstSunday(now.getFullYear(), now.getMonth());
    const end = new Date(current);
    end.setHours(21,0,0,0);
    if(now <= end) return current;
    const nm = new Date(now.getFullYear(), now.getMonth()+1, 1);
    return firstSunday(nm.getFullYear(), nm.getMonth());
  }

  function updateClock(){
    const now = new Date();
    document.getElementById('today').textContent = arDate.format(now);
    document.getElementById('clock').textContent = timeFmt.format(now);

    const meet = nextMeeting(now);
    const meetStart = new Date(meet); meetStart.setHours(18,0,0,0);
    const meetEnd = new Date(meet); meetEnd.setHours(21,0,0,0);
    document.getElementById('nextMeetingDate').textContent = arMeetingDate.format(meet);

    if(now >= meetStart && now <= meetEnd){
      document.getElementById('countdown').textContent = 'الاجتماع قائم الآن';
      return;
    }
    let diff = Math.max(0, meetStart-now);
    const days = Math.floor(diff/86400000); diff%=86400000;
    const hours = Math.floor(diff/3600000); diff%=3600000;
    const mins = Math.floor(diff/60000);
    let t='متبقي ';
    if(days) t += days+' يوم ';

<script>
function weatherEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 48) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  if (code <= 86) return '🌨️';
  return '⛈️';
}

if ('geolocation' in navigator) {
  navigator.geolocation.getCurrentPosition(async (position) => {
    try {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;

      const response = await fetch(url);
      const data = await response.json();

      document.getElementById('weatherIcon').textContent =
        weatherEmoji(data.current.weather_code);

      document.getElementById('weatherTemp').textContent =
        Math.round(data.current.temperature_2m) + '°F';

      document.getElementById('weatherMini').style.display = 'flex';
    } catch (e) {
      console.log('Weather unavailable');
    }
  });
}
</script>

  } else {
    answer.style.display = "none";
    this.textContent = "إظهار الإجابة";
  }
});
</script>
<script>
(function () {
  const iosInstallBtn = document.getElementById('iosInstallBtn');
  if (!iosInstallBtn) return;

  const isIOS =
    /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const isInstalled =
    window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;

  if (isIOS && !isInstalled) {
    iosInstallBtn.style.display = 'block';
  }

  iosInstallBtn.addEventListener('click', function () {
    alert(
      'لتثبيت التطبيق على iPhone:\n\n' +
      '1. افتح التطبيق في Safari\n' +
      '2. اضغط زر المشاركة ⬆️\n' +
      '3. اختر إضافة إلى الشاشة الرئيسية\n' +
      '4. اضغط إضافة'
    );
  });
})();
</script>
<script>
(function () {
  const welcome = document.getElementById('welcomeScreen');
  if (!welcome) return;

  setTimeout(function () {
    welcome.style.transition = 'opacity .55s ease';
    welcome.style.opacity = '0';

    setTimeout(function () {
      welcome.style.display = 'none';
    }, 550);
  }, 2000);
})();
</script>
